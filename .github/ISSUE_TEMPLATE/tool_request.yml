name: Tool request
description: Something you do in Tiime that an agent cannot do yet.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste credentials, tokens or real account data.** Redact the request examples.
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What you would ask the agent, and what you do in the Tiime web application today.
      placeholder: '"Export my revenue book for Q3 as a PDF" — today I go to Accounting → Revenue book → Export.'
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Tiime request (optional)
      description: |
        In the web application, open the browser developer tools (Network tab) and do the
        action: the method, route, Accept header and payload of the request help a lot.
      render: http
  - type: dropdown
    id: write
    attributes:
      label: Does it change data in Tiime?
      options:
        - No, read only
        - Yes, reversible
        - Yes, irreversible (sending, finalizing, deleting…)
    validations:
      required: true
