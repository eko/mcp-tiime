version: 2

project_name: mcp-tiime

before:
  hooks:
    - go mod download

builds:
  - id: mcp-tiime
    main: ./cmd/mcp-tiime
    binary: mcp-tiime
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

# Fat macOS binary for the Claude Desktop extension, which can only pick a
# binary per OS, not per CPU architecture. Not archived on its own.
universal_binaries:
  - id: mcp-tiime-universal
    ids: [mcp-tiime]
    name_template: mcp-tiime
    replace: false

archives:
  - id: mcp-tiime
    ids: [mcp-tiime]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
